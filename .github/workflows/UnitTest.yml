name: Unit test

on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  schedule:
    - cron: '20 00 1 * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1']
        os: [ubuntu-latest, windows-latest, macOS-latest]

    env:
      # The emulator suite is only exercised on one job: Linux, latest Julia. The
      # other jobs run the unit tests and let the integration tests self-skip.
      RUN_EMULATOR: ${{ matrix.os == 'ubuntu-latest' && matrix.julia-version == '1' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      # The integration tests start the Firebase Emulator Suite themselves (see
      # test/emulator_process.jl). That needs the Firebase CLI and a JDK; without
      # them the tests self-skip, so these steps are what actually exercises the
      # Firestore/Realtime DB roundtrips in CI.
      - name: Set up Node
        if: env.RUN_EMULATOR == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        if: env.RUN_EMULATOR == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Firebase emulator jars
        if: env.RUN_EMULATOR == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('test/firebase.json') }}
          restore-keys: ${{ runner.os }}-firebase-emulators-

      - name: Install the Firebase CLI
        if: env.RUN_EMULATOR == 'true'
        run: npm install -g firebase-tools

      - uses: julia-actions/julia-buildpkg@v1

      - name: Unit test
        uses: julia-actions/julia-runtest@v1
        env:
          FIREBASE_EMULATOR_AUTOSTART: ${{ env.RUN_EMULATOR }}
          # Cold CI runners download the emulator jars on first use.
          FIREBASE_EMULATOR_TIMEOUT: '300'
